name: Monthly Maintenance

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theia-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Refresh nixpkgs and Theia metadata
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake update nixpkgs
          nix develop --command ./scripts/update-sources

      - name: Validate maintained repository
        run: ./scripts/validate-local

      - name: Record successful maintenance heartbeat
        shell: bash
        run: |
          mkdir -p .github
          date -u +%Y-%m-%d > .github/.last-maintenance

      - name: Commit validated maintenance
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "theia-nix maintenance"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock source.nix .github/.last-maintenance
          git commit -m "maintenance: refresh dependencies"
          git push
