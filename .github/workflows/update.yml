name: Update Theia IDE

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: theia-maintenance
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Discover current stable release
        run: nix develop --command ./scripts/update-sources

      - name: Detect source change
        id: change
        shell: bash
        run: |
          if git diff --quiet -- source.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate update
        if: steps.change.outputs.changed == 'true'
        run: ./scripts/validate-local

      - name: Commit validated update
        if: steps.change.outputs.changed == 'true'
        shell: bash
        run: |
          version="$(nix --extra-experimental-features 'nix-command flakes' eval --raw --file source.nix version)"
          git config user.name "theia-nix updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.nix
          git commit -m "theia-ide-server: update to $version"
          git push
